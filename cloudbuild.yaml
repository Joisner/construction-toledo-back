steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'europe-southwest1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/backend-toledo:latest', '.']
  
  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-southwest1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/backend-toledo:latest']

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'europe-southwest1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/backend-toledo:latest'
